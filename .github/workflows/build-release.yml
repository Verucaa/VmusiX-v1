name: Build Release APK - Vmusix

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Vmusix APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Dummy Local Properties and Keystore if needed
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
            -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Build Debug & Release APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p output_apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apks/ \;
          ls -lah output_apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vmusix-APK
          path: output_apks/*.apk
          retention-days: 14
